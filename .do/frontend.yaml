name: au-journey-frontend
static_sites:
- name: frontend
  source_dir: /frontend
  github:
    repo: AU-Journey/au-journey-web  # Replace with your GitHub username/repo
    branch: main
    deploy_on_push: true
  build_command: npm run build
  output_dir: dist
  index_document: index.html
  error_document: index.html
  environment_slug: node-js
  envs:
  - key: VITE_BACKEND_URL
    value: https://au-journey-web-backend-gk6n3.ondigitalocean.app