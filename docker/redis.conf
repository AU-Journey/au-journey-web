# Redis Configuration for AU Journey Web
# Optimized for both development and production use

# Network settings
bind 0.0.0.0
port 6379
protected-mode no

# Memory and persistence
maxmemory 256mb
maxmemory-policy allkeys-lru

# Enable RDB persistence
# Save if at least 1 key changed in 900 seconds
save 900 1
# Save if at least 10 keys changed in 300 seconds  
save 300 10
# Save if at least 10000 keys changed in 60 seconds
save 60 10000

# RDB file settings
dbfilename dump.rdb
dir /data

# AOF (Append Only File) for better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Performance optimizations
tcp-keepalive 300
timeout 0

# Memory optimizations for GPS data
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
set-max-intset-entries 512 